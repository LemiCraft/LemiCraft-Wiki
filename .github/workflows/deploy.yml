name: Build & Deploy Wiki

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. Устанавливаем pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 4. Ставим зависимости
      - name: Install dependencies
        run: pnpm install

      # 5. Строим сайт
      - name: Build Nuxt
        run: pnpm build

      # 6. Копируем .output на сервер
      - name: Deploy .output to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: ".output/"
          target: "${{ secrets.DEPLOY_PATH }}/.output/"
